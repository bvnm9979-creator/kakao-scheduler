# =============================================================
#  .github/workflows/build.yml
#  카카오톡 예약 발송 프로그램 — Windows .exe 자동 빌드
# =============================================================

name: Windows EXE Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # Node.js 24 경고 해소

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      # ── Step 1: 코드 받기 ──────────────────────────────────
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      # ── Step 2: Python 설치 ────────────────────────────────
      - name: 🐍 Python 3.11 세팅
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── Step 3: 패키지 설치 ────────────────────────────────
      - name: 📦 패키지 설치
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── Step 4: pywin32 post-install ───────────────────────
      # pywin32는 설치 후 별도 초기화 스크립트가 필요
      - name: 🔧 pywin32 초기화
        shell: pwsh
        run: |
          python -c "
          import subprocess, sys, os, glob
          pattern = os.path.join(os.path.dirname(sys.executable), 'Scripts', 'pywin32_postinstall.py')
          scripts = glob.glob(pattern)
          if scripts:
              subprocess.run([sys.executable, scripts[0], '-install'], check=False)
              print('pywin32 초기화 완료')
          else:
              print('pywin32_postinstall.py 없음, 건너뜀')
          "

      # ── Step 5: PyInstaller 빌드 ───────────────────────────
      # 주의: EXE 이름은 영문만 사용 (한글 이름은 빌드 환경에서 인코딩 오류 발생)
      - name: 🏗️ PyInstaller 빌드
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --noconfirm `
            --name "KakaoScheduler" `
            --hidden-import customtkinter `
            --hidden-import PIL `
            --hidden-import PIL._tkinter_finder `
            --hidden-import pywinauto `
            --hidden-import pywinauto.application `
            --hidden-import pywinauto.keyboard `
            --hidden-import pywinauto.findwindows `
            --hidden-import pyperclip `
            --hidden-import win32gui `
            --hidden-import win32con `
            --hidden-import win32clipboard `
            --hidden-import win32process `
            --hidden-import win32api `
            --collect-all customtkinter `
            --collect-all pywinauto `
            main.py

      # ── Step 6: 빌드 결과 확인 ────────────────────────────
      - name: 🔍 결과 확인
        shell: pwsh
        run: |
          if (Test-Path "dist\KakaoScheduler.exe") {
            Write-Host "✅ 빌드 성공: KakaoScheduler.exe"
            Get-Item "dist\KakaoScheduler.exe" | Select-Object Name, Length
          } else {
            Write-Host "❌ EXE 파일 없음"
            exit 1
          }

      # ── Step 7: Artifacts 업로드 ──────────────────────────
      - name: 📤 EXE 업로드
        uses: actions/upload-artifact@v4
        with:
          name: KakaoScheduler-Windows-EXE
          path: dist/KakaoScheduler.exe
          retention-days: 30
          if-no-files-found: error
