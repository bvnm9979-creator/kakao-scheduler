# =============================================================
#  .github/workflows/build.yml
#  카카오톡 예약 발송 프로그램 — Windows .exe 자동 빌드
# =============================================================

name: Windows EXE Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      # ── Step 1: 코드 받기 ──────────────────────────────────
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      # ── Step 2: Python 설치 ────────────────────────────────
      - name: 🐍 Python 3.11 세팅
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── Step 3: 패키지 설치 ────────────────────────────────
      # pywin32 306+ 은 pip install 시 자동 초기화됨 (별도 post-install 불필요)
      - name: 📦 패키지 설치
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import win32api; print('pywin32 OK')"

      # ── Step 4: PyInstaller 빌드 ───────────────────────────
      - name: 🏗️ PyInstaller 빌드
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --noconfirm `
            --name "KakaoScheduler" `
            --hidden-import customtkinter `
            --hidden-import PIL `
            --hidden-import PIL._tkinter_finder `
            --hidden-import pywinauto `
            --hidden-import pywinauto.application `
            --hidden-import pywinauto.keyboard `
            --hidden-import pywinauto.findwindows `
            --hidden-import pyperclip `
            --hidden-import win32gui `
            --hidden-import win32con `
            --hidden-import win32clipboard `
            --hidden-import win32process `
            --hidden-import win32api `
            --collect-all customtkinter `
            --collect-all pywinauto `
            main.py

      # ── Step 5: 빌드 결과 확인 ────────────────────────────
      - name: 🔍 결과 확인
        shell: pwsh
        run: |
          if (Test-Path "dist\KakaoScheduler.exe") {
            Write-Host "✅ 빌드 성공"
            Get-Item "dist\KakaoScheduler.exe" | Select-Object Name, Length
          } else {
            Write-Host "❌ EXE 파일 없음"
            exit 1
          }

      # ── Step 6: Artifacts 업로드 ──────────────────────────
      - name: 📤 EXE 업로드
        uses: actions/upload-artifact@v4
        with:
          name: KakaoScheduler-Windows-EXE
          path: dist/KakaoScheduler.exe
          retention-days: 30
          if-no-files-found: error
